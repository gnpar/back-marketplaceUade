name: Lint (Spotless)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: Reporte de formato
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Spotless check
        id: spotless
        run: |
          if ./mvnw --batch-mode --no-transfer-progress spotless:check; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            ./mvnw --batch-mode --no-transfer-progress spotless:apply
            echo "result=dirty" >> "$GITHUB_OUTPUT"
            echo "diff<<'SPOTLESS_EOF'" >> "$GITHUB_OUTPUT"
            git diff --no-color >> "$GITHUB_OUTPUT"
            echo "SPOTLESS_EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar comentario en el PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: spotless
          message: |
            ${{ steps.spotless.outputs.result == 'dirty' && '❌ Spotless detectó problemas de formateo. Ejecutá `./mvnw spotless:apply` localmente:' || '✅ No hay problemas de formateo.' }}
            ${{ steps.spotless.outputs.result == 'dirty' && format('```diff{0}```', steps.spotless.outputs.diff) || '' }}
