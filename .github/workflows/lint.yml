name: Lint (Spotless)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: Reporte de formato
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Spotless check
        run: |
          if ./mvnw --batch-mode --no-transfer-progress spotless:check; then
            printf '✅ No hay problemas de formateo.\n' > "$RUNNER_TEMP/spotless.md"
          else
            ./mvnw --batch-mode --no-transfer-progress spotless:apply
            printf '❌ Spotless detectó problemas de formateo. Ejecutá `./mvnw spotless:apply` localmente:\n\n' > "$RUNNER_TEMP/spotless.md"
            printf '```diff\n' >> "$RUNNER_TEMP/spotless.md"
            git diff --no-color >> "$RUNNER_TEMP/spotless.md"
            printf '\n```\n' >> "$RUNNER_TEMP/spotless.md"
          fi

      - name: Publicar comentario en el PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: spotless
          path: ${{ runner.temp }}/spotless.md
