spring.application.name=marketplaceUade

# Perfil por defecto: MySQL (los tests lo reemplazan con el perfil h2)
spring.profiles.default=mysql

# Actuator: exponer endpoint de mappings
management.endpoints.web.exposure.include=mappings,health,info

# JWT
jwt.secret=${JWT_SECRET:una-clave-secreta-bien-larga-cambiar-en-produccion-1234567890}
jwt.expiration=86400000

# Imagenes de productos: el servicio valida ademas formato, firma y limite por producto.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
